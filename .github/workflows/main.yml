name: Auto Update BLUXUS

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Cek Firebase untuk update
        run: |
          curl -s "https://crazyxrat-default-rtdb.asia-southeast1.firebasedatabase.app/dev_update.json" > update.json
          # Periksa apakah status update bernilai true
          STATUS=$(jq -r '.status' update.json)
          if [ "$STATUS" = "true" ]; then
            echo "UPDATE_TRIGGERED=true" >> $GITHUB_ENV
          else
            echo "UPDATE_TRIGGERED=false" >> $GITHUB_ENV
          fi

      - name: Jalankan update
        if: env.UPDATE_TRIGGERED == 'true'
        run: |
          # Ganti index.html dengan index_new.html (yang sudah disiapkan)
          cp index_new.html index.html
          git config --global user.name "BLUXUS Bot"
          git config --global user.email "bot@bluxus.com"
          git add index.html
          git commit -m "Auto update from Admin Panel"
          git push
          
          # Reset status update di Firebase agar tidak terus-menerus terpicu
          curl -X PATCH "https://crazyxrat-default-rtdb.asia-southeast1.firebasedatabase.app/dev_update.json" -d '{"status":false}'
